<text x="384" y="216" fill="#81e4cb" font-size="14">Cited source + lessons + omissions + investigation trace</text>
<text x="36" y="409" fill="#a4c0cd" font-size="14">CodeBearing supplies evidence. Your assistant makes the edits and runs the tests.</text>
