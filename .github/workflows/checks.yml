name: checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python evals/run.py
      - run: python evals/investigate.py
      - run: python evals/coding_bench.py self-check
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[mcp]"
      - run: python -m unittest discover -s tests -v
        env:
          DIFFCONTEXT_REQUIRE_MCP: '1'
