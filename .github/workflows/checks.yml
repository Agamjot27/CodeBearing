name: checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python evals/run.py
      - run: python evals/investigate.py
      - run: python evals/indexing.py
      - run: python evals/hybrid.py
      - run: python evals/coding_bench.py self-check
      - run: python evals/coding_bench.py self-check --condition-set hybrid
  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[mcp,typescript]"
      - run: python -m unittest discover -s tests -v
        env:
          DIFFCONTEXT_REQUIRE_MCP: '1'
          DIFFCONTEXT_REQUIRE_TYPESCRIPT: '1'
      - run: python evals/typescript.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/check_wheel.py dist/codebearing-0.6.0-py3-none-any.whl --typescript
