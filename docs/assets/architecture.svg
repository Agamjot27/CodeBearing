<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">How CodeBearing prepares context</title>
<desc id="desc">Assistant requests enter a local MCP server. AST and Tree-sitter indexing feed localization, dependency expansion and context packing. Confirmed fresh SQLite lessons join packing. Cited evidence returns to the assistant, which edits and tests.</desc>
