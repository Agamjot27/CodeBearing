<text x="54" y="139">Task / symbols / Git ref</text><text x="320" y="139">Six read-only tools</text>
<text x="54" y="323">AST + Tree-sitter</text><text x="54" y="346">Source, imports, call edges</text>
<text x="556" y="139">Lexical + diff evidence</text><text x="788" y="139">Bounded callers / callees</text>
<text x="1016" y="139">Estimated text budget</text>
